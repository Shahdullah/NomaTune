name: Refresh release badges
on:
  schedule:
    - cron: '37 3,15 * * *'
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
permissions:
  contents: write
concurrency:
  group: release-badges
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/release-badges.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git add README.md assets/badges/release.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh release badges'
          git push origin HEAD:refs/heads/main
