name: Release NomaTune

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.device }}-${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: mobile, deviceName: Mobile, abi: universal }
          - { device: mobile, deviceName: Mobile, abi: arm64    }
          - { device: mobile, deviceName: Mobile, abi: armeabi  }
          - { device: mobile, deviceName: Mobile, abi: x86_64   }
          - { device: mobile, deviceName: Mobile, abi: x86      }
          - { device: tv,     deviceName: Tv,     abi: universal }

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          ABI="${{ matrix.abi }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          DEVICE="${{ matrix.device }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          echo "gradle_task=assembleGms${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DEVICE}-${ABI}-release.apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-${DEVICE}-${ABI}-release" >> "$GITHUB_OUTPUT"
          echo "abi_cap=${ABI_CAP}" >> "$GITHUB_OUTPUT"
          echo "device_cap=${DEVICE_CAP}" >> "$GITHUB_OUTPUT"

      - name: Set up signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Every release MUST be signed with the permanent NomaTune key.
          # Never fall back to a generated/temporary key — refuse to build instead.
          for VAR in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!VAR:-}" ]; then
              echo "::error::$VAR repository secret is not set. Refusing to build with a temporary key. Set KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > /tmp/release.jks
          EXPECTED_SHA256="17:C1:E0:EB:F2:1F:D9:2F:99:F5:32:D6:37:E9:DD:0A:85:D3:C7:BC:EC:56:FB:FF:D6:60:81:C4:BB:FF:84:41"
          KEY_INFO="$(keytool -list -v -keystore /tmp/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 || true)"
          if ! grep -qi "$EXPECTED_SHA256" <<< "$KEY_INFO"; then
            echo "::error::Decoded keystore SHA-256 does not match permanent NomaTune key ($EXPECTED_SHA256). Refusing to sign."
            exit 1
          fi
          echo "KEYSTORE_PATH=/tmp/release.jks"        >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"  >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS"                  >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD"            >> "$GITHUB_ENV"
          echo "Permanent NomaTune signing key verified ($EXPECTED_SHA256)." 

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          ABI="${{ matrix.abi }}"
          if [ "$ABI" = "armeabi" ] || [ "$ABI" = "x86" ]; then
            ./gradlew "$GRADLE_TASK" 2>&1 | python3 -c "import re,sys;p=re.compile(r'^\[CXX5202\]');[sys.stdout.write(l) for l in sys.stdin if not p.match(l.rstrip())]"
          else
            ./gradlew "$GRADLE_TASK"
          fi
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Could not resolve APK output directory — listing all:"
          find app/build/outputs/apk -maxdepth 6 -type d || true
          exit 1

      - name: Sign APK with apksigner (V2/V3 signatures)
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          APK_NAME="${{ steps.variant.outputs.apk_name }}"
          mkdir -p release-apks
          RAW="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed*" | head -n 1)"
          if [ -z "${RAW:-}" ]; then
            echo "No APK found in $RELEASE_DIR:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          echo "Signing: $RAW"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "release-apks/$APK_NAME" \
            "$RAW"
          CERT_OUT="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "release-apks/$APK_NAME")"
          echo "$CERT_OUT"
          if ! grep -qi "17c1e0ebf21fd92f99f532d637e9dd0a85d3c7bcec56fbffd66081c4bbff8441" <<< "$CERT_OUT"; then
            echo "::error::Signed APK certificate mismatch!"
            exit 1
          fi
          echo "Signed APK:"
          ls -lh "release-apks/$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: release-apks/${{ steps.variant.outputs.apk_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all APKs
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: app-*-release
          merge-multiple: true
          path: release-apks/

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NomaTune v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          # Release notes are written below (no auto changelog).
          # NOTE: update the body text on every release — keep it short, friendly and emoji-rich.
          generate_release_notes: false
          body: |
            ## What's New in v${{ steps.ver.outputs.version }} 🎵

            **Full ArchiveTune playback parity — songs start every time and play all the way through.**

            ### 🎧 Complete Playback & Stream Engine Upgrade
            - 🌃 **"Midnight City" & major-label tracks fixed** — wired `:morideobfuscator` (`youtubei.js` QuickJS cipher + catalog replacement) into `MusicService` and `DownloadUtil`, plus upgraded `NewPipeExtractor` to `0.27.1`
            - 🛡️ **1 MB GVS PoToken verification (`GvsPoTokenVerifier`)** — pre-verifies `pot=` tokens past YouTube's 1 MB unchecked prefix and fixes `appendGvsPoToken` `videoId` binding so tracks never hit `HTTP 403` ~1 minute in
            - 🔥 **No more mid-song cutoffs** — added `ChunkedDataSource` below `CacheDataSource`, moved `ResolvingDataSource` inside the cache layer, exempted WebM/Opus/Ogg/FLAC open-ended reads in `StreamChunkResolver`, and pinned `itag` metadata across quality switches
            - 🔄 **Position-preserving mid-stream recovery** — fixed `isFullyCachedMedia` check in `onPlayerError` so transient network drops or expired URLs seamlessly resume at your exact timestamp instead of stopping playback
            - 🌐 **Dual-stack IPv4/IPv6 & header parity** — wired `PlaybackHttpClient` into `MusicService` and `DownloadUtil`, fixed `MWEB`/`WEB`/`WEB_CREATOR` `Origin`/`Referer` headers, and aligned `BotGuardTokenGenerator` pre-warming

            ### 🔑 Seamless Updates Guaranteed
            - 🔐 **Signed & verified with the permanent NomaTune release key** — installs cleanly right over your existing NomaTune app without uninstalling

            Thanks for keeping the music going. 💛
          files: release-apks/*.apk
